<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NX DP+SMS - VIP Signal</title>
    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', 'Orbitron', sans-serif;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #030308;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ------------------ কাস্টম ৩-সেকেন্ড প্রিমিয়াম লোডার (GPU Accelerated & Fast) ------------------ */
        #customAppLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #030511;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            will-change: opacity, visibility;
        }

        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 36px;
            width: 90%;
            max-width: 480px;
        }

        .ring-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translateZ(0); /* Force GPU Rendering */
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 5px solid transparent;
            will-change: transform;
        }

        /* ড্রপ শ্যাডোর বদলে হালকা বক্স-শ্যাডো ব্যবহার করা হয়েছে যেন প্রসেসরে চাপ না পড়ে */
        .ring-1 {
            width: 100%;
            height: 100%;
            border-top-color: #00f2fe;
            border-right-color: #00f2fe;
            animation: spinClockwise 1.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .ring-2 {
            width: 82%;
            height: 82%;
            border-bottom-color: #ff0844;
            border-left-color: #ff0844;
            animation: spinCounterClockwise 1.4s linear infinite;
            box-shadow: 0 0 15px rgba(255, 8, 68, 0.4);
        }

        .ring-3 {
            width: 64%;
            height: 64%;
            border-top-color: #7928ca;
            border-left-color: #ff007f;
            animation: spinClockwise 2.2s ease-in-out infinite;
            box-shadow: 0 0 18px rgba(255, 0, 127, 0.4);
        }

        .center-avatar {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.7);
            z-index: 2;
        }

        .center-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .loader-content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .loader-text {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }

        .percentage-text {
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            font-weight: 900;
            color: #00f2fe;
            text-shadow: 0 0 12px #00f2fe;
        }

        .loader-progress-bg {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .loader-progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00f2fe 0%, #7928ca 50%, #ff0844 100%);
            border-radius: 20px;
            transition: width 3s linear;
            box-shadow: 0 0 14px #ff0844;
            will-change: width;
        }

        @keyframes spinClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinCounterClockwise {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
        /* ------------------------------------------------------------- */

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .external-top-right-clock {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            font-weight: 800;
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.4);
            padding: 6px 14px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.3);
            letter-spacing: 1px;
            display: none;
        }

        .device-container {
            position: relative;
            z-index: 10;
            width: 95%;
            max-width: 420px;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(10, 11, 24, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 4px solid #00f2fe;
            border-radius: 32px;
            padding: 34px 22px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.25);
            animation: cardFrameZigzag 4s infinite alternate;
            width: 100%;
            display: none;
        }

        #dashboardView {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            border-radius: 0 !important;
            border: none !important;
            border-left: 5px solid #00f2fe;
            border-right: 5px solid #ff007f;
            background: rgba(3, 5, 15, 0.98) !important;
            display: none;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 16px 16px 20px 16px !important;
            box-shadow: inset 0 0 50px rgba(0, 242, 254, 0.15);
            z-index: 100;
        }

        .dashboard-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            position: relative;
            margin-bottom: 5px;
        }

        .realtime-clock {
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            font-weight: 800;
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.4);
            padding: 6px 14px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.3);
            letter-spacing: 1px;
        }

        .top-settings-btn {
            background: rgba(0, 242, 254, 0.1);
            border: 1.5px solid #00f2fe;
            color: #00f2fe;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            transition: transform 0.2s;
        }
        .top-settings-btn:active { transform: scale(0.9); }

        .settings-dropdown {
            position: absolute;
            top: 48px;
            right: 0;
            background: rgba(10, 11, 24, 0.98);
            border: 1.5px solid #00f2fe;
            border-radius: 14px;
            padding: 15px;
            width: 210px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
            display: none;
            flex-direction: column;
            gap: 12px;
            text-align: left;
            z-index: 100;
        }
        .settings-dropdown.show { display: flex; }

        .settings-info-item {
            font-size: 12px;
            color: #cbd5e1;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .settings-info-item span {
            color: #00ffcc;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
        }

        .btn-logout {
            background: #ff007f;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .avatar-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 12px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatUpDown 3.5s ease-in-out infinite;
        }

        .avatar-glow-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #00f2fe, #ff007f, #7928ca, #00f2fe);
            animation: pulseGlow 2s infinite linear;
            filter: blur(6px);
        }

        .avatar-core {
            position: relative;
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: #060919;
            border: 2px solid #00f2fe;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
        }

        .avatar-core img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(90deg, #00f2fe, #ffffff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .tag-badge {
            display: inline-block;
            background: rgba(0, 242, 254, 0.12);
            border: 1px solid rgba(0, 242, 254, 0.6);
            color: #00f2fe;
            padding: 3px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .input-box-wrapper {
            position: relative;
            margin-bottom: 18px;
        }

        .input-box {
            width: 100%;
            background: rgba(4, 7, 18, 0.95);
            border: 2.5px solid #00f2fe;
            border-radius: 16px;
            padding: 15px 12px 15px 44px;
            font-size: 23px;
            font-family: 'Orbitron', monospace;
            font-weight: 800;
            letter-spacing: 2px;
            outline: none;
            text-align: center;
            animation: borderZigzagGlow 3s infinite alternate, textZigzagGlow 2.5s infinite alternate;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #ffb703;
            font-size: 18px;
        }

        .btn-copy {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #00d2ff 0%, #0072ff 50%, #ff007f 100%);
            background-size: 200% 200%;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.45);
            animation: gradientMove 4s ease infinite;
        }

        .btn-copy:active { transform: scale(0.97); }

        .divider {
            display: flex;
            align-items: center;
            margin: 22px 0;
            color: #64748b;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.12);
        }
        .divider span { padding: 0 10px; }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-social {
            padding: 11px;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-telegram { background: #0088cc; box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); }
        .btn-whatsapp { background: #25d366; box-shadow: 0 0 15px rgba(37, 211, 102, 0.4); }

        .footer-badges {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            color: #94a3b8;
            font-size: 12px;
        }

        .zigzag-wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 5px auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .zigzag-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px dashed #ff007f;
            border-top: 6px solid #00f2fe;
            border-bottom: 6px solid #00ffcc;
            animation: spinWheel 6s linear infinite;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.7), inset 0 0 30px rgba(255, 0, 127, 0.5);
        }

        .signal-inner-core {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: rgba(4, 7, 18, 0.98);
            border: 4px solid #00f2fe;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            box-shadow: 0 0 45px rgba(0, 242, 254, 0.9);
            overflow: hidden;
        }

        .huge-numeric-signal {
            font-family: 'Orbitron', sans-serif;
            font-size: 52px;
            font-weight: 900;
            color: #00ffcc;
            text-shadow: 0 0 2px #ffffff, 0 0 10px #00ffcc, 0 0 20px rgba(0, 255, 204, 0.6);
            animation: numericPulse 1.6s infinite alternate;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .huge-numeric-signal span {
            font-size: 0.55em;
            color: #00f2fe;
            text-shadow: none;
        }

        .support-floating-wrapper {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: none;
        }

        .support-toggle-btn {
            width: 62px;
            height: 62px;
            background: linear-gradient(135deg, #00f2fe, #7928ca);
            border-radius: 50%;
            border: 2px solid #ffffff;
            color: white;
            font-size: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.9);
            animation: floatAndPulseSupport 2.5s ease-in-out infinite;
        }

        .support-popup-menu {
            position: absolute;
            bottom: 72px;
            right: 0;
            background: rgba(10, 11, 24, 0.95);
            border: 1.5px solid #00f2fe;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition: all 0.3s ease-in-out;
            min-width: 160px;
        }
        .support-popup-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .support-link-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .support-link-telegram { background: rgba(0, 136, 204, 0.3); border: 1px solid #0088cc; }
        .support-link-whatsapp { background: rgba(37, 211, 102, 0.3); border: 1px solid #25d366; }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: #00f2fe;
            color: #030308;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.8);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease-in-out;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes spinWheel { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes numericPulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.08); } }
        @keyframes floatAndPulseSupport {
            0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 0 25px rgba(0, 242, 254, 0.8); }
            50% { transform: translateY(-10px) scale(1.1); box-shadow: 0 0 40px rgba(255, 0, 127, 0.9); }
        }
        @keyframes cardFrameZigzag {
            0% { border-color: #00f2fe; box-shadow: 0 0 35px rgba(0, 242, 254, 0.6), inset 0 0 20px rgba(0, 242, 254, 0.2); }
            33% { border-color: #ff007f; box-shadow: 0 0 40px rgba(255, 0, 127, 0.6), inset 0 0 22px rgba(255, 0, 127, 0.2); }
            66% { border-color: #7928ca; box-shadow: 0 0 38px rgba(121, 40, 202, 0.6), inset 0 0 20px rgba(121, 40, 202, 0.2); }
            100% { border-color: #00ffcc; box-shadow: 0 0 42px rgba(0, 255, 204, 0.6), inset 0 0 25px rgba(0, 255, 204, 0.2); }
        }
        @keyframes borderZigzagGlow { 0% { border-color: #00f2fe; box-shadow: 0 0 18px #00f2fe; } 50% { border-color: #ff007f; box-shadow: 0 0 22px #ff007f; } 100% { border-color: #00ffcc; box-shadow: 0 0 20px #00ffcc; } }
        @keyframes textZigzagGlow { 0% { color: #00f2fe; text-shadow: 0 0 10px #00f2fe; } 50% { color: #ff007f; text-shadow: 0 0 14px #ff007f; } 100% { color: #00ffcc; text-shadow: 0 0 12px #00ffcc; } }
        @keyframes floatUpDown { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes pulseGlow { 0% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.1) rotate(180deg); } 100% { transform: scale(1) rotate(360deg); } }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    </style>
</head>
<body>

    <!-- ৩-সেকেন্ড কাস্টম প্রিমিয়াম লোডার -->
    <div id="customAppLoader">
        <div class="loader-wrapper">
            <div class="ring-container">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
                <div class="center-avatar">
                    <img src="https://i.ibb.co.com/PsQQn5X3/1793439478752.jpg" alt="Logo">
                </div>
            </div>
            
            <div class="loader-content-box">
                <div class="status-header">
                    <span class="loader-text">LOADING...</span>
                    <span class="percentage-text" id="loaderPercentage">0%</span>
                </div>
                <div class="loader-progress-bg">
                    <div class="loader-progress-fill" id="loaderProgressBar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- স্ক্রিনের একদম ওপরের ডান কোণায় রিয়েল-টাইম ক্লক -->
    <div class="external-top-right-clock" id="externalTopClock">00:00:00 AM</div>

    <canvas id="bgCanvas"></canvas>

    <div class="device-container">
        <!-- 1. Original Login / Code View -->
        <div class="card" id="loginView">
            <div class="avatar-wrapper">
                <div class="avatar-glow-ring"></div>
                <div class="avatar-core">
                    <img src="https://i.ibb.co.com/JRGxStQN/icon.jpg" alt="Logo" id="logoImg">
                </div>
            </div>

            <h1 class="brand-title">NX AVIATOR SIGNAL</h1>

            <div class="input-box-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>

            </div>

            <button class="btn-copy" id="copyBtn" onclick="copyActivationCode()">

                <span>এক্টিভিশন কোড কপি করুন</span>
            </button>

            <div class="divider">
                <span>অথবা</span>
            </div>

            <div class="social-grid">
                <a href="https://t.me/Nx1xdetcrashhavk" target="_blank" class="btn-social btn-telegram"><i class="fa-brands fa-telegram"></i> Telegram</a>
                <a href="https://wa.me/8801342742911" target="_blank" class="btn-social btn-whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
            </div>

            <div class="footer-badges">
                <span><i class="fa-solid fa-shield-halved" style="color:#00f2fe;"></i> নিরাপদ</span> •
                <span><i class="fa-solid fa-bolt" style="color:#00f2fe;"></i> দ্রুত</span> •
                <span><i class="fa-solid fa-gem" style="color:#00f2fe;"></i> নির্ভরযোগ্য</span>
            </div>
        </div>

        <!-- 2. Full Screen Signal Dashboard View -->
        <div class="card" id="dashboardView">
            <div class="dashboard-top-bar">
                <div class="realtime-clock" id="realtimeClock">00:00:00 AM</div>
                <div class="top-settings-btn" onclick="toggleSettingsMenu()" title="Settings">
                    <i class="fa-solid fa-gear"></i>
                </div>

    <!-- High Performance Optimized Loader Logic -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('loaderProgressBar');
            const percentageText = document.getElementById('loaderPercentage');
            const loaderContainer = document.getElementById('customAppLoader');

            // CSS-ভিত্তিক 3s স্মুথ ফিলিং
            requestAnimationFrame(() => {
                if (progressBar) progressBar.style.width = '100%';
            });

            // requestAnimationFrame দিয়ে কোনো ল্যাগ ছাড়াই ৬০ FPS পার্সেন্টেজ আপডেট
            const duration = 3000;
            const startTime = performance.now();

            function updateProgress(currentTime) {
                const elapsedTime = currentTime - startTime;
                const progress = Math.min(elapsedTime / duration, 1);
                const percent = Math.floor(progress * 100);

                if (percentageText) {
                    percentageText.innerText = percent + '%';
                }

                if (progress < 1) {
                    requestAnimationFrame(updateProgress);
                } else {
                    if (loaderContainer) {
                        loaderContainer.style.opacity = '0';
                        loaderContainer.style.visibility = 'hidden';
                    }
                }
            }

            requestAnimationFrame(updateProgress);
        });
    </script>
